<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In | Guard Infra</title>
<style>
  :root{--bg:#080c14;--card:#0f1521;--border:#1e2a3d;--accent:#5eead4;--text:#e6edf7;--muted:#8b9bb4;--err:#f87171;--ok:#4ade80}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .wrap{width:100%;max-width:400px}
  .brand{display:block;text-align:center;font-size:1.5rem;font-weight:700;color:var(--text);text-decoration:none;margin-bottom:28px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:32px}
  h1{font-size:1.35rem;margin-bottom:6px}
  .sub{color:var(--muted);font-size:.9rem;margin-bottom:24px}
  label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:6px}
  input{width:100%;padding:11px 13px;border-radius:8px;border:1px solid var(--border);
        background:var(--bg);color:var(--text);font-size:.95rem;margin-bottom:16px}
  input:focus{outline:none;border-color:var(--accent)}
  button{width:100%;padding:12px;border:none;border-radius:8px;background:var(--accent);
         color:#062024;font-weight:700;font-size:.95rem;cursor:pointer}
  button:hover{opacity:.9}
  .msg{padding:11px 13px;border-radius:8px;font-size:.87rem;margin-bottom:18px}
  .msg.err{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.35);color:var(--err)}
  .msg.ok{background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.35);color:var(--ok)}
  .alt{text-align:center;margin-top:20px;font-size:.88rem;color:var(--muted)}
  .alt a{color:var(--accent);text-decoration:none}
</style>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<style>
  /* The brand mark is an <img> now, not an emoji, so it needs an explicit box.
     background/border-radius are reset because one page wrapped the old emoji
     in a coloured tile that would clash with the mark's own gradient. */
  .brand-icon, .logo-icon {
    width: 30px; height: 30px; display: inline-block;
    vertical-align: -0.34em; background: none; border-radius: 0; flex: none;
  }
</style>
</head>
<body>
  <div class="wrap">
    <a href="/cloud-guard" class="brand"><img src="/static/logo.svg" alt="" class="brand-icon"> Guard Infra</a>
    <div class="card">
      <h1>Sign in</h1>
      <p class="sub">Access your Cloud Guard dashboard.</p>

      {{if .Error}}<div class="msg err">{{.Error}}</div>{{end}}
      {{if .Success}}<div class="msg ok">{{.Success}}</div>{{end}}

      <form method="POST" action="/login">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{.Email}}" required autofocus autocomplete="email">

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">

        <button type="submit">Sign in</button>
      </form>

      <p class="alt" style="margin-top:14px"><a href="/forgot-password">Forgot your password?</a></p>

      {{if .SignupsEnabled}}
      <p class="alt">No account? <a href="/signup">Create one</a></p>
      {{end}}
    </div>
  </div>
</body>
</html>
