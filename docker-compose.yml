version: '3.8'

services:
  cloud-guard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloud-guard-app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_PATH=/root/data/cloudguard.db
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
    volumes:
      - cloudguard-data:/root/data
    restart: unless-stopped

volumes:
  cloudguard-data:
